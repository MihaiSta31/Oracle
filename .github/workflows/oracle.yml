name: Oracle

on:
  schedule:
    - cron: "7 * * * *"   # în fiecare oră, la minutul 7 (UTC)
  workflow_dispatch:       # buton "Run workflow" pentru rulare manuală

permissions:
  contents: write          # ca să poată salva data/ înapoi în repo

concurrency:
  group: oracle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run Oracle
        run: python oracle.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Save state
        run: |
          git config user.name "oracle-bot"
          git config user.email "oracle-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Oracle: update state" && git push)
